[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seiyuu-faceid"
version = "0.1.0"
description = "Local AdaFace and R50 supervised identity classification"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Tano" }]
dependencies = [
  "numpy==2.5.2",
  "opencv-python==5.0.0.93",
  "onnxruntime==1.29.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]
training = ["scikit-learn==1.9.1"]
web = ["streamlit==1.61.1"]
api = [
    "fastapi>=0.115,<1",
    "pillow>=12.3,<13",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seiyuu_faceid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
