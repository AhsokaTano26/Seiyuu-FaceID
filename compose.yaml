services:
  faceid:
    image: ${FACEID_IMAGE:-tano26/seiyuu-faceid:latest}
    # Pull explicitly when installing/updating; startup and recreation also work offline.
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "${FACEID_BIND_ADDRESS:-0.0.0.0}:${FACEID_PORT:-8000}:8000"
    environment:
      SEIYUU_FACEID_API_KEY: ${SEIYUU_FACEID_API_KEY:?Set a nonempty API key in .env}
      SEIYUU_FACEID_CONFIG: /app/configs/default.yaml
      SEIYUU_FACEID_SERVE_UI: "0"
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./configs/default.yaml
        target: /app/configs/default.yaml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
