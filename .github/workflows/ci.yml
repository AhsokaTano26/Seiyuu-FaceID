name: CI and Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra api --extra web --extra dev
      - name: Check dependencies
        run: uv pip check
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Compile Python sources
        run: uv run python -m compileall -q src tools app.py

  docker:
    name: Publish Docker Hub image
    needs: quality
    if: github.event_name != 'pull_request' && github.repository == 'AhsokaTano26/Seiyuu-FaceID'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure the DOCKERHUB_TOKEN repository secret with push access to tano26/seiyuu-faceid."
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tano26/seiyuu-faceid
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tano26
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=faceid
          cache-to: type=gha,mode=max,scope=faceid
