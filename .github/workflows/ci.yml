name: CI, deployments and models
run-name: ${{ (github.event.release.tag_name || github.event.client_payload.tag || inputs.model_tag) && format('Model {0}', github.event.release.tag_name || github.event.client_payload.tag || inputs.model_tag) || format('CI {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  release:
    types: [published]
  repository_dispatch:
    types: [model-published]
  workflow_dispatch:
    inputs:
      model_tag:
        description: "Published models-<digest> Release to validate and build deployments for"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event.release.tag_name || github.event.client_payload.tag || inputs.model_tag) && format('model-{0}', github.event.release.tag_name || github.event.client_payload.tag || inputs.model_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select application revision and model inputs
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'models-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.inputs.outputs.revision }}
      model_tag: ${{ steps.inputs.outputs.model_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Model tags identify weights. Build the current application from main.
          ref: ${{ (github.event_name == 'release' || github.event_name == 'repository_dispatch' || inputs.model_tag != '') && 'main' || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        if: github.event_name == 'release' || github.event_name == 'repository_dispatch' || inputs.model_tag != ''
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Pin verified model inputs
        id: inputs
        env:
          MODEL_TAG: ${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.model_tag }}
          MODEL_EVENT: ${{ github.event_name == 'release' || github.event_name == 'repository_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODEL_EVENT" = "true" ] && [ -z "$MODEL_TAG" ]; then
            echo "::error::Model publication events require a model tag."
            exit 1
          fi
          if [ -n "$MODEL_TAG" ]; then
            uv sync --locked --no-dev
            uv run --no-sync python tools/prepare_model_release.py --tag "$MODEL_TAG" --root dist/model-inputs
          else
            mkdir -p dist/model-inputs/release
            cp release/model-source.json release/training.json dist/model-inputs/release/
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "model_tag=$MODEL_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: model-inputs
          path: dist/model-inputs/release/
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: uv sync --locked --extra api --extra web --extra dev
      - run: uv pip check
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -m compileall -q src tools app.py

  deployments:
    name: Python and Docker deployment packages
    needs: [prepare, quality]
    env:
      BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: model-inputs
          path: release/
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-dev --extra api
      - name: Validate pinned model and actual training counts
        run: |
          uv run --no-sync python tools/fetch_models.py
          uv run --no-sync python -c 'from pathlib import Path; from tools.package_models import validate_training; validate_training(Path.cwd())'
      - name: Build deployment archives
        run: |
          uv run --no-sync python tools/package_ci_deployments.py --kind python --revision "$BUILD_REVISION" --output dist/ci
          uv run --no-sync python tools/package_ci_deployments.py --kind docker --revision "$BUILD_REVISION" --output dist/ci
      - name: Smoke test relocated Python package
        run: |
          stage="$RUNNER_TEMP/python-deployment"
          mkdir -p "$stage"
          tar -xzf "dist/ci/seiyuu-faceid-python-$BUILD_REVISION.tar.gz" -C "$stage"
          cp -a models "$stage/models"
          (cd "$stage" && sha256sum --check SHA256SUMS)
          uv run --no-sync python tools/smoke_deployment.py --kind python --root "$stage" --log dist/python-smoke.log
      - name: Validate Compose profiles
        env:
          SEIYUU_FACEID_API_KEY: ci-config-validation-key
        run: |
          stage="$RUNNER_TEMP/docker-deployment"
          mkdir -p "$stage"
          tar -xzf "dist/ci/seiyuu-faceid-docker-$BUILD_REVISION.tar.gz" -C "$stage"
          cp -a models "$stage/models"
          (cd "$stage" && sha256sum --check SHA256SUMS)
          docker compose --project-directory "$stage" -f "$stage/compose.yaml" config --quiet
          docker compose --project-directory "$stage" -f "$stage/compose.yaml" -f "$stage/compose.n150.yaml" config --quiet
      - name: Upload Python deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: seiyuu-faceid-python-${{ needs.prepare.outputs.revision }}${{ needs.prepare.outputs.model_tag && format('-{0}', needs.prepare.outputs.model_tag) || '' }}
          path: |
            dist/ci/seiyuu-faceid-python-*.tar.gz
            dist/ci/seiyuu-faceid-python-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Docker Compose deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: seiyuu-faceid-docker-${{ needs.prepare.outputs.revision }}${{ needs.prepare.outputs.model_tag && format('-{0}', needs.prepare.outputs.model_tag) || '' }}
          path: |
            dist/ci/seiyuu-faceid-docker-*.tar.gz
            dist/ci/seiyuu-faceid-docker-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: Linux amd64 C++ and Go runtime
    needs: [prepare, quality]
    env:
      BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: model-inputs
          path: release/
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl ca-certificates libgl1 libglib2.0-0 libgomp1
      - name: Cache verified dependencies
        id: native-deps
        uses: actions/cache@v6.1.0
        with:
          path: |
            dist/native-deps/downloads
            dist/native-deps/opencv
          key: native-ubuntu22-amd64-v1-${{ hashFiles('native/build.sh') }}
      - name: Build and run CTest and Go suites
        env:
          DEPS_CACHED: ${{ steps.native-deps.outputs.cache-hit }}
          JOBS: "2"
        run: |
          if [ "$DEPS_CACHED" = "true" ]; then
            bash native/build.sh --app-only
          else
            bash native/build.sh
          fi
      - name: Prepare exact model configurations
        run: |
          uv sync --locked --no-dev --extra api
          uv run --no-sync python tools/fetch_models.py
          uv run --no-sync python tools/export_native_model.py --config configs/n150.yaml
          uv run --no-sync python tools/export_native_model.py --config configs/n150.yaml --flush-denormals --output models/selected/native-n150.json
      - name: Check FP32 features and decisions against Python
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          folder = Path("dist/ci-crops")
          folder.mkdir()
          rng = np.random.default_rng(20261028)
          for i in range(4):
              if not cv2.imwrite(str(folder / f"{i}.png"), rng.integers(0, 256, (112, 112, 3), dtype=np.uint8)):
                  raise RuntimeError("Could not write synthetic crop")
          PY
          uv run --no-sync python tools/validate_native.py --library dist/native-runtime/lib/libfaceid_core.so --model models/selected/native-n150.json --config configs/n150.yaml --crop-dir dist/ci-crops --samples 4 --output dist/native-smoke-parity.json
      - name: Package and smoke test relocated runtime
        run: |
          uv run --no-sync python tools/package_ci_deployments.py --kind native --revision "$BUILD_REVISION" --runtime dist/native-runtime --output dist/ci
          stage="$RUNNER_TEMP/native-deployment"
          mkdir -p "$stage"
          tar -xzf "dist/ci/seiyuu-faceid-native-linux-amd64-$BUILD_REVISION.tar.gz" -C "$stage"
          (cd "$stage" && sha256sum --check SHA256SUMS)
          cp -an models/. "$stage/models/"
          uv run --no-sync python tools/smoke_deployment.py --kind native --root "$stage" --log dist/native-smoke.log
      - name: Upload Linux amd64 native deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: seiyuu-faceid-native-linux-amd64-${{ needs.prepare.outputs.revision }}${{ needs.prepare.outputs.model_tag && format('-{0}', needs.prepare.outputs.model_tag) || '' }}
          path: |
            dist/ci/seiyuu-faceid-native-linux-amd64-*.tar.gz
            dist/ci/seiyuu-faceid-native-linux-amd64-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  docker:
    name: Publish Docker Hub image
    needs: [prepare, quality, deployments]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'AhsokaTano26/Seiyuu-FaceID' &&
      (needs.prepare.outputs.model_tag != '' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Check publishing credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure DOCKERHUB_TOKEN with push access to tano26/seiyuu-faceid."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tano26/seiyuu-faceid
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.prepare.outputs.model_tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ needs.prepare.outputs.model_tag == '' }}
            type=raw,value=sha-${{ needs.prepare.outputs.revision }}
            type=raw,value=${{ needs.prepare.outputs.model_tag || 'unused' }},enable=${{ needs.prepare.outputs.model_tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
      - uses: docker/login-action@v4
        with:
          username: tano26
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=faceid
          cache-to: type=gha,mode=max,scope=faceid

  models:
    name: Publish model-only Release
    needs: [prepare, quality, deployments, native, docker]
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.model_tag == '' &&
      github.repository == 'AhsokaTano26/Seiyuu-FaceID' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: model-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: model-inputs
          path: release/
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Prepare model allowlist and verified sample counts
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python tools/fetch_models.py
          uv run --no-sync python tools/package_models.py --output dist/model-release --notes dist/model-notes.md --metadata dist/model-release.json
      - name: Publish model Release and ensure deployment CI is triggered
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          uv run --no-sync python tools/publish_models.py --directory dist/model-release --metadata dist/model-release.json --notes dist/model-notes.md --revision "$BUILD_REVISION" --dispatch
