models:
  detector: models/det_500m.onnx
  classifier: models/selected

detector:
  max_long_edge: 1920
  input_size: [640, 640]
  score_threshold: 0.50
  nms_threshold: 0.40

quality:
  min_face_size: 48
  min_sharpness: 20.0

recognition:
  top_k: 5
  probability_threshold: 0.95

runtime:
  intra_op_threads: 2
  inter_op_threads: 1
